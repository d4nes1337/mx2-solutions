name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      # The product noun is "strategy" (2026-07 redesign). Old copy must not
      # creep back into user-facing web code; hyphenated ids/keys
      # (smart-orders) are storage/compat and intentionally allowed.
      - name: Copy check (no "smart order" in web)
        run: |
          if grep -rni "smart order" apps/web/app apps/web/components apps/web/lib --include="*.ts" --include="*.tsx"; then
            echo '::error::Found forbidden "smart order" copy — the product noun is "strategy".'
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
